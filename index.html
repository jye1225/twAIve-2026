<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>twAIve - AI 윤리 스토리 게임</title>
    <link rel="stylesheet" href="css/styles.css?v=20261008-6" />
  </head>
  <body>
    <section class="login-screen" id="loginScreen" aria-label="로그인">
      <div class="auth-shell">
        <button class="auth-intro" id="authIntro" type="button" aria-label="로그인 화면으로 이동">
          <img class="auth-intro-art" src="assets/episodes/episode-deepfake.webp" alt="" fetchpriority="high" />
          <img class="auth-intro-logo" src="assets/twaive-logo.webp" alt="AI 윤리 스토리 twAIve" fetchpriority="high" />
        </button>

        <form class="login-card" id="loginForm" hidden>
          <header class="auth-heading">
            <p class="eyebrow">twAIve</p>
            <h1>AI 윤리 스토리</h1>
            <p class="login-copy" id="authModeCopy">로그인</p>
          </header>

          <button class="auth-back signup-only" id="showLoginButton" type="button" hidden>로그인으로 돌아가기</button>

          <label>
            <span>아이디</span>
            <span class="input-row">
              <input id="usernameInput" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
              <button class="check-button signup-only" id="checkUsernameButton" type="button" hidden>중복확인</button>
            </span>
          </label>

          <label class="signup-only" hidden>
            <span>별명</span>
            <input id="displayNameInput" name="displayName" type="text" autocomplete="nickname" maxlength="30" />
          </label>

          <label>
            <span>비밀번호</span>
            <input
              id="passwordInput"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>

          <label class="signup-only" hidden>
            <span>비밀번호 확인</span>
            <span class="input-row">
              <input
                id="passwordConfirmInput"
                name="passwordConfirm"
                type="password"
                autocomplete="new-password"
              />
              <button class="check-button signup-only" id="checkPasswordButton" type="button" hidden>확인</button>
            </span>
          </label>

          <p class="auth-message signup-only" id="passwordCheckMessage" aria-live="polite" hidden></p>

          <label class="auth-consent signup-only" hidden>
            <input id="signupAgeCheck" type="checkbox" />
            <span>만 14세 이상이에요.</span>
          </label>
          <label class="auth-consent signup-only" hidden>
            <input id="signupTermsCheck" type="checkbox" />
            <span>이용약관과 개인정보처리방침을 확인했고, 계정·학습 기록 처리에 동의해요.</span>
          </label>

          <p class="login-error" id="loginError" role="alert"></p>

          <button class="login-button" id="authSubmitButton" type="submit">로그인</button>
          <button class="signup-link login-only" id="showSignupButton" type="button">회원가입하기</button>

          <nav class="legal-links" aria-label="서비스 정책">
            <a href="terms.html">이용약관</a>
            <a href="privacy.html">개인정보처리방침</a>
          </nav>
        </form>
      </div>
    </section>

    <main class="app-shell">
      <section class="play-surface game-screen" aria-label="AI 윤리 스토리 게임">
        <header class="topbar">
          <button class="icon-button" id="resetButton" type="button" aria-label="처음으로" title="에피소드 선택으로 돌아가기">
            <span aria-hidden="true">↺</span>
          </button>
          <div class="brand-block">
            <p>twAIve</p>
            <h1>AI 윤리 스토리</h1>
          </div>
          <div class="score-pill" aria-live="polite">
            <span id="scoreLabel">
              <span class="score-caption">AI 윤리 감수성</span>
              <strong class="score-value">진단 전</strong>
            </span>
          </div>
          <div class="user-menu">
            <span id="userLabel">admin</span>
            <button class="text-button" id="logoutButton" type="button">로그아웃</button>
          </div>
          <div class="save-status" id="saveStatus" role="status" aria-live="polite" hidden></div>
        </header>

        <div class="episode-tabs" id="episodeTabs" aria-label="에피소드 선택"></div>

        <section class="story-stage" data-expression="neutral">
          <div class="scene-art story-background" aria-hidden="true">
            <img id="sceneArtwork" src="assets/episodes/episode-deepfake.webp" alt="" />
            <div class="scene-shade"></div>
          </div>
          <aside class="cast-panel" aria-label="인물과 주제">
            <p class="eyebrow" id="topicLabel">딥페이크 · 초상권</p>
            <h2 id="episodeTitle">삭제되지 않은 얼굴</h2>
            <p id="episodeSummary">학교 축제 홍보 SNS에서 시작된 AI 얼굴 합성 사건.</p>
            <div class="meter-group" id="meterGroup"></div>
          </aside>

          <article class="dialogue-panel">
            <div class="chapter-line" id="chapterLine">Chapter 1</div>
            <h3 id="sceneTitle">이거 진짜 사람처럼 된다니까?</h3>
            <div class="scene-text" id="sceneText"></div>
            <blockquote id="quoteText"></blockquote>
          </article>
        </section>

        <section class="choice-dock" aria-label="선택지">
          <div class="feedback" id="feedbackBox" aria-live="polite"></div>
          <div class="choices" id="choices"></div>
        </section>

        <nav class="bottom-nav" aria-label="학습 진행">
          <button type="button" class="nav-item is-active" data-view="story">스토리</button>
          <button type="button" class="nav-item" data-view="record">기록</button>
          <button type="button" class="nav-item" data-view="learn">학습</button>
          <button type="button" class="nav-item" data-view="profile">마이페이지</button>
          <button type="button" class="teacher-return-button" id="teacherReturnButton">마이페이지로 돌아가기</button>
        </nav>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config/supabase-config.js?v=20260630-1"></script>
    <script src="js/analysis/feature-extractor.js?v=20261002-1"></script>
    <script src="js/analysis/principle-scorer.js?v=20261002-1"></script>
    <script src="js/analysis/learner-classifier.js?v=20261002-1"></script>
    <script src="js/analysis/content-recommender.js?v=20261002-1"></script>
    <script src="js/analysis/teaching-strategy.js?v=20261002-1"></script>
    <script src="js/analysis/learning-model.js?v=20261002-1"></script>
    <script src="js/analysis/demo-analytics.js?v=20261002-1"></script>
    <script src="js/scoring-engine.js?v=20261002-1"></script>
    <script src="js/app.js?v=20261008-6"></script>
  </body>
</html>
